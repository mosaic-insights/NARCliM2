[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narclim-workflow"
version = "0.2.0"
description = "Reproducible NARCliM2.0 THREDDS download, climate-model uncertainty, spatial-summary, storm-index, and mapping workflow."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jabbar Khaledi" },
]
keywords = [
    "NARCliM",
    "climate",
    "climate-risk",
    "geospatial",
    "GIS",
    "THREDDS",
    "NetCDF",
    "xarray",
    "raster",
]
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "numpy>=1.26",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "dask>=2024.1",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
