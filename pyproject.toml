[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "narclim-workflow"
version = "0.3.0"
description = "Reproducible NARCliM2.0 climate-data download, uncertainty, spatial-summary, time-series, storm-hazard, flood-hazard, and mapping workflow."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Jabbar Khaledi" },
]

keywords = [
    "NARCliM",
    "climate",
    "climate-risk",
    "climate-change",
    "geospatial",
    "GIS",
    "THREDDS",
    "NetCDF",
    "xarray",
    "rainfall",
    "temperature",
    "flood",
    "storm",
    "raster",
]

dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pandas>=2.1",
    "numpy>=1.26",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "dask>=2024.1",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "matplotlib>=3.8",
]


[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "pytest>=8.0",
    "ruff>=0.6",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 100
target-version = "py311"